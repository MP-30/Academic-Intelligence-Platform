[tool.pytest.ini_options]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
asyncio_default_test_loop_scope = "function"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/academic_ai"]

[project]
name = "academic-intelligence-platform"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.1",
    "asyncpg>=0.32.0",
    "boto3>=1.43.125",
    "boto3-stubs~=1.43.125",
    "fastapi[standard]>=0.162.0",
    "gradio>=6.31.0",
    "httpx>=0.28.1",
    "mcp[cli]>=2.3.0",
    "opentelemetry-api>=1.45.2",
    "opentelemetry-instrumentation-fastapi>=0.66b2",
    "opentelemetry-sdk>=1.45.2",
    "pgvector>=0.5.1",
    "psycopg[binary]>=3.3.8",
    "pydantic-settings>=2.16.2",
    "pypdf>=6.21.4",
    "python-jose[cryptography]>=3.5.0",
    "sa>=0.0.4",
    "sqlalchemy[asyncio]>=2.1.8",
    "strands-agents>=1.64.0",
    "strands-agents-tools>=0.9.0",
    "structlog>=26.1.0",
    "tavily-python>=0.8.5",
    "tiktoken>=0.14.0",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "datasets>=5.2.0",
    "httpx>=0.28.1",
    "langchain-aws>=1.9.2",
    "langchain-community>=0.3.31,<0.4.0",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "pyyaml>=6.0.3",
    "ragas>=0.3.9,<0.4.0",
    "ruff>=0.17.4",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes — real bugs
    "I",   # import sorting
]
ignore = [
    "E501",  # line length — not worth fighting
    "B008",  # FastAPI Depends/File/Form in defaults — framework pattern, not a bug
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
"scripts/*" = ["E501"]
